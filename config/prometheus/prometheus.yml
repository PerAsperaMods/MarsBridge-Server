# Prometheus configuration for MarsBridge Server infrastructure
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Monitor Prometheus itself
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

  # Monitor MarsBridge Server application
  - job_name: 'marsbridge-server'
    scrape_interval: 15s
    static_configs:
      - targets: ['marsbridge-server:8080']
    metrics_path: '/metrics'

  # Monitor PostgreSQL database
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres:5432']

  # Monitor Redis cache
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['redis:6379']

  # Monitor RabbitMQ message broker
  - job_name: 'rabbitmq'
    scrape_interval: 30s
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics/per-object'

  # Optional: Monitor Docker host metrics
  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']